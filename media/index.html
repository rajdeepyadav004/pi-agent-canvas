<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="__CSP__" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agent Canvas</title>
  <style>
    /* pi-agent-canvas — canvas surface hosting the assistant-ui thread. */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body {
      background: #0d0e12;
      font: 13px/1.5 -apple-system, 'Segoe UI', system-ui, sans-serif;
    }
    #root { position: fixed; inset: 0; width: 100vw; height: 100vh; }
  </style>
</head>
<body>
  <div id="root"></div>
  <!-- The server endpoint is per-window (see canvasPanel.ts), so the bundle
       reads it instead of hardcoding a port. -->
  <script nonce="__NONCE__">window.__PI_CANVAS_WS__ = '__WS_URL__';</script>
  <script src="__SCRIPT_URI__" nonce="__NONCE__"></script>
</body>
</html>
