<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="__CSP__" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agent Canvas</title>
  <style>
    /* pi-agent-canvas — canvas surface hosting the assistant-ui thread. */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body {
      background: #0d0e12;
      font: 13px/1.5 -apple-system, 'Segoe UI', system-ui, sans-serif;
    }
    #root { position: fixed; inset: 0; width: 100vw; height: 100vh; }
  </style>
</head>
<body>
  <div id="root"></div>
  <!-- Server endpoint and session are per-panel (see canvasPanel.ts), so the
       bundle reads them instead of hardcoding a port or a conversation. -->
  <script nonce="__NONCE__">
    window.__PI_CANVAS_WS__ = __WS_URL__;
    // Empty session id = fall back to __PI_CANVAS_MODE__ ('new' | 'continue').
    window.__PI_CANVAS_SESSION__ = __SESSION_ID__;
    window.__PI_CANVAS_MODE__ = __SESSION_MODE__;
  </script>
  <script src="__SCRIPT_URI__" nonce="__NONCE__"></script>
</body>
</html>
